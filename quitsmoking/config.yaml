name: Quit Smoking
version: 2.1.0
slug: quitsmoking
description: Track your smoking cessation journey with interval/daily scheduling, progress stats, and notifications
url: https://github.com/lweijl/hassio-addon-quitsmoking
arch:
  - aarch64
  - amd64
  - armv7
init: false
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:lungs
panel_title: Quit Smoking
ports:
  8099/tcp: null
map:
  - config:rw
  - addon_config:rw
options:
  notify_services:
    - notify.mobile_app_phone
schema:
  notify_services:
    - str?
startup: application
boot: auto
